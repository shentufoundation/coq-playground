<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>JsCoq Playground</title>
    <meta http-equiv="content-type" content="text/html;charset=utf-8" />
    <meta name="description" content="An Online IDE for the Coq Theorem Prover" />
    <link rel="icon" href="frontend/classic/images/favicon.png">
    <link rel="stylesheet" type="text/css" href="dist/frontend/index.css"/>
    <link rel="stylesheet" type="text/css" href="frontend/classic/css/coq-dark.css"/>
    <style>
      .cm-s-blackboard.CodeMirror {
        background: radial-gradient(100% 100% at 50% 0,#212023 0,#1b1a1d 100%);
      }
      .jscoq-theme-dark#panel-wrapper {
        background: radial-gradient(100% 100% at 50% 0,#212023 0,#1b1a1d 100%);
      }
    </style>
  </head>

<body class="jscoq-main">
  <div id="ide-wrapper"> </div>

  <script type="module">
    import { JsCoq } from './dist/frontend/index.js';

    var sp = new URLSearchParams(location.search), code_key = sp.get('ck') || 'coqcode';

    var jscoq_ids  = ['#ide-wrapper'];
    var jscoq_opts = {
        implicit_libs: false,
        focus: false,
        editor: { mode: { 'company-coq': true }, theme: 'blackboard' },
        theme: 'dark',
        all_pkgs: ['coq', 'mathcomp', 'openmath']
    };

    JsCoq.start(jscoq_ids, jscoq_opts).then(res => {
        /* Global reference */
        window.coq = res;
        var code = localStorage.getItem(code_key);
        if (code && code.length > 2) {
            coq.provider.load(JSON.parse(code), 'playground');
        } else if (code_key != 'coqcode') {
            coq.provider.load(JSON.parse(localStorage.getItem('coqcode')), 'playground');
        }
    });
    window.addEventListener('beforeunload', () => {
        localStorage.setItem(code_key, JSON.stringify(coq.provider.snippets[0].editor.getValue()));
    });
  </script>
</body>
</html>
